name: Build and deploy mosaic app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Generate the site
        env:
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
        run: |
          mkdir site
          cat > site/index.html <<'EOF_HTML'
          <!DOCTYPE html>
          <html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Internet Photo Mosaic</title>
          <style>
          :root{--bg:#faf8f5;--card:#fff;--fg:#1d1b18;--mut:#6f6a62;--acc:#d9531e;--bd:#e4dfd7}
          @media (prefers-color-scheme:dark){:root{--bg:#161512;--card:#211f1b;--fg:#f1ede6;--mut:#a09a8f;--acc:#ff7a45;--bd:#37332c;color-scheme:dark}}
          *{box-sizing:border-box}
          body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
          main{max-width:760px;margin:0 auto;padding:20px 16px 40px}
          h1{font-size:1.6rem;margin:0 0 4px}
          .s,.m{color:var(--mut)}
          .card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
          label.b,button{display:inline-block;background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer}
          button.g{background:transparent;color:var(--fg);border:1px solid var(--bd)}
          button:disabled{opacity:.5;cursor:default}
          input[type=file]{display:none}
          input[type=range]{width:100%;accent-color:var(--acc)}
          input[type=text],select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);font:inherit}
          .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
          .half{flex:1;min-width:140px}
          .out{overflow-x:auto}
          canvas{max-width:100%;height:auto;border-radius:8px;display:block}
          a{color:var(--acc)}
          </style></head><body><main>
          <h1>Internet Photo Mosaic</h1>
          <p class="s">Upload a photo and rebuild it out of images from the internet.</p>

          <div class="card">
          <div class="m" id="ks"></div>
          <details style="margin-top:6px"><summary class="m">Use a different Pixabay key</summary>
          <div class="row" style="margin-top:8px">
          <input id="key" type="text" placeholder="Paste a key here" autocomplete="off" style="flex:1;min-width:180px">
          <button id="sk" class="g">Save key</button>
          </div>
          </details>
          </div>

          <div class="card">
          <div class="m" style="margin-bottom:6px">What should the tiles be? (leave empty for random)</div>
          <input id="q" type="text" placeholder="e.g. cats, flowers, space, food" autocomplete="off">
          <div class="row" style="margin-top:12px">
          <label class="b">Choose photo<input id="src" type="file" accept="image/*"></label>
          <button id="go" disabled>Make mosaic</button>
          <button id="nw" class="g" disabled>New images</button>
          <button id="dl" class="g" disabled>Download</button>
          </div>
          </div>

          <div class="card">
          <div class="m">Tiles across: <b id="tv">100</b> <span id="tc"></span></div>
          <input id="tn" type="range" min="16" max="400" value="100">
          <div class="m" style="margin-top:8px">Images to fetch: <b id="pv">200</b></div>
          <input id="pn" type="range" min="40" max="800" step="10" value="200">
          <div class="row" style="margin-top:12px">
          <div class="half"><div class="m">Output size</div>
          <select id="sz"><option value="2000000">Small (fastest)</option><option value="6000000" selected>Medium</option><option value="16000000">Large (heavy)</option></select></div>
          <div class="half"><div class="m">Download as</div>
          <select id="fm"><option value="jpg" selected>JPEG (small file)</option><option value="png">PNG (big file)</option></select></div>
          </div>
          </div>

          <div class="card out"><canvas id="out" width="1" height="1"></canvas><p class="m" id="st">Waiting for a photo…</p></div>

          <script>
          const $=id=>document.getElementById(id);
          const T=20,CONC=24,MAXSRC=1200;
          const BUILTIN='__PIXABAY_KEY__';
          const WORDS=['nature','city','flowers','animals','food','ocean','mountains','architecture','sky','forest','street','art','birds','cars','sunset','garden','market','bridge','desert','winter','beach','coffee','space','texture','fruit','lake','snow','autumn','dog','cat'];
          let srcImg=null,pool=[],poolKey=null;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));

          function builtin(){return BUILTIN.indexOf('__PIX')===0?'':BUILTIN}
          function getKey(){let k='';try{k=localStorage.getItem('pxkey')||''}catch(e){}return k||builtin()}
          function setKey(k){try{localStorage.setItem('pxkey',k)}catch(e){}}
          function showKey(){
            const k=getKey();
            $('ks').textContent=k?(builtin()&&k===builtin()?'Pixabay key is built in. Pixabay will be used.':'Your saved key is set. Pixabay will be used.'):'No Pixabay key, so Wikimedia Commons will be used.';
          }
          $('sk').onclick=()=>{setKey($('key').value.trim());poolKey=null;showKey()};
          showKey();

          function upd(){
            const c=+$('tn').value;$('tv').textContent=c;
            const r=srcImg?Math.max(1,Math.round(c*srcImg.height/srcImg.width)):c;
            $('tc').textContent='('+(c*r).toLocaleString()+' tiles)';
          }
          $('tn').oninput=upd;
          $('pn').oninput=()=>$('pv').textContent=$('pn').value;
          $('q').onkeydown=e=>{if(e.key==='Enter'&&srcImg){e.preventDefault();run()}};

          // Shrink big phone photos right away so everything after is lighter
          $('src').onchange=e=>{
            const f=e.target.files[0];if(!f)return;
            const i=new Image();
            i.onload=()=>{
              const k=Math.min(1,MAXSRC/Math.max(i.width,i.height));
              const c=document.createElement('canvas');
              c.width=Math.max(1,Math.round(i.width*k));c.height=Math.max(1,Math.round(i.height*k));
              const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(i,0,0,c.width,c.height);
              URL.revokeObjectURL(i.src);
              srcImg=c;
              $('go').disabled=false;$('nw').disabled=false;
              $('st').textContent='Photo loaded. Tap "Make mosaic".';upd();
            };
            i.src=URL.createObjectURL(f);
          };
          upd();

          function mk(){const c=document.createElement('canvas');c.width=c.height=T;return c}
          function avg(c){const d=c.getContext('2d').getImageData(0,0,T,T).data;let r=0,g=0,b=0,n=T*T;for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2]}return[r/n,g/n,b/n]}

          function loadTile(url,src){
            return new Promise(res=>{
              const im=new Image();
              let done=false;
              const fin=v=>{if(!done){done=true;res(v)}};
              const to=setTimeout(()=>{im.src='';fin(null)},6000);
              im.crossOrigin='anonymous';
              im.onload=()=>{
                clearTimeout(to);
                try{
                  const c=mk(),x=c.getContext('2d'),s=Math.min(im.width,im.height);
                  x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,T,T);
                  fin({c,a:avg(c),src});
                }catch(e){fin(null)}
              };
              im.onerror=()=>{clearTimeout(to);fin(null)};
              im.src=url;
            });
          }

          async function loadAll(urls,src,onTile){
            let idx=0,ok=0;
            const w=async()=>{
              while(idx<urls.length){
                const u=urls[idx++];
                const t=await loadTile(u,src);
                if(t){pool.push(t);ok++;onTile()}
              }
            };
            await Promise.all(Array.from({length:Math.min(CONC,urls.length)},w));
            return ok;
          }

          async function pixabayPage(key,q,page){
            const u='https://pixabay.com/api/?key='+encodeURIComponent(key)+'&q='+encodeURIComponent(q)+'&image_type=photo&safesearch=true&per_page=200&page='+page;
            const r=await fetch(u);
            if(!r.ok){let t='';try{t=(await r.text()).slice(0,60)}catch(e){}throw new Error('Pixabay said '+r.status+' '+t)}
            const j=await r.json();
            return (j.hits||[]).map(h=>h.previewURL).filter(Boolean);
          }

          async function commonsBatch(q,offset){
            const base='https://commons.wikimedia.org/w/api.php?action=query&prop=imageinfo&iiprop=url|mime&iiurlwidth=60&format=json&origin=*';
            const u=q
              ?base+'&generator=search&gsrnamespace=6&gsrlimit=50&gsroffset='+offset+'&gsrsearch='+encodeURIComponent(q+' filetype:bitmap')
              :base+'&generator=random&grnnamespace=6&grnlimit=50&grnfilterredir=nonredirects&rnd='+Date.now()+'-'+Math.random();
            const r=await fetch(u,{cache:'no-store'});
            if(!r.ok)throw new Error('Commons '+r.status);
            const j=await r.json();
            const pages=Object.values((j.query&&j.query.pages)||{});
            return pages.map(p=>p.imageinfo&&p.imageinfo[0]).filter(i=>i&&i.mime==='image/jpeg'&&i.thumburl).map(i=>i.thumburl);
          }

          async function fillPool(target,q){
            pool=[];
            const seen=new Set();
            const t0=performance.now();
            const status=m=>{
              const s=(performance.now()-t0)/1000;
              $('st').textContent=`${m} ${Math.min(pool.length,target)}/${target} (${s.toFixed(0)}s, ${(pool.length/Math.max(s,.1)).toFixed(0)} images/sec)`;
            };
            let msg='';

            const key=getKey();
            if(key){
              try{
                const jobs=[];
                if(q){for(let p=1;p<=Math.min(3,Math.ceil(target/200));p++)jobs.push([q,p])}
                else{
                  const ws=WORDS.slice().sort(()=>Math.random()-.5);
                  const n=Math.ceil(target/150)+1;
                  for(let i=0;i<n&&i<ws.length;i++)jobs.push([ws[i],1+Math.floor(Math.random()*2)]);
                }
                for(let i=0;i<jobs.length&&pool.length<target;i+=3){
                  const chunk=jobs.slice(i,i+3);
                  const lists=await Promise.all(chunk.map(j=>pixabayPage(key,j[0],j[1])));
                  let urls=[].concat(...lists).filter(u=>!seen.has(u));
                  urls=[...new Set(urls)].slice(0,target-pool.length+40);
                  urls.forEach(u=>seen.add(u));
                  status('Pixabay…');
                  const before=pool.length;
                  const ok=await loadAll(urls,'px',()=>{if(pool.length%10===0)status('Pixabay…')});
                  if(!ok&&urls.length&&before===0){msg='Pixabay images were blocked by the browser';break}
                }
              }catch(e){msg=e.message;console.error(e)}
            }else msg='No Pixabay key';

            if(pool.length<target){
              let fails=0,empty=0,offset=0;
              const worker=async()=>{
                while(pool.length<target&&fails<8&&empty<12){
                  try{
                    const off=offset;offset+=50;
                    const urls=(await commonsBatch(q,off)).filter(u=>!seen.has(u));
                    urls.forEach(u=>seen.add(u));
                    if(!urls.length){empty++;continue}
                    await Promise.all(urls.map(u=>loadTile(u,'wc').then(t=>{if(t){pool.push(t);if(pool.length%10===0)status(msg?msg+'. Wikimedia…':'Wikimedia…')}})));
                  }catch(e){fails++;console.error(e)}
                }
              };
              await Promise.all(Array.from({length:8},worker));
            }
            if(pool.length<20)throw new Error('Could not find enough images'+(q?' for "'+q+'". Try a broader search word.':'. Check your connection and try again.'));
          }

          async function run(force){
            if(!srcImg)return;
            $('go').disabled=true;$('nw').disabled=true;$('dl').disabled=true;
            try{
              const q=$('q').value.trim().toLowerCase(),target=+$('pn').value,key=q+'|'+getKey();
              if(force||key!==poolKey||pool.length<target*0.8){await fillPool(target,q);poolKey=key}
              await draw();
            }catch(e){$('st').textContent=e.message;console.error(e);poolKey=null}
            $('go').disabled=false;$('nw').disabled=false;
          }
          $('go').onclick=()=>run(false);
          $('nw').onclick=()=>run(true);

          async function draw(){
            const cols=+$('tn').value,rows=Math.max(1,Math.round(cols*srcImg.height/srcImg.width));
            const cells=cols*rows;
            const maxPx=+$('sz').value;
            const CS=Math.max(4,Math.min(20,Math.floor(Math.sqrt(maxPx/cells))));
            const s=document.createElement('canvas');s.width=cols;s.height=rows;
            const sx=s.getContext('2d');sx.imageSmoothingQuality='high';sx.drawImage(srcImg,0,0,cols,rows);
            const px=sx.getImageData(0,0,cols,rows).data;
            const o=$('out');o.width=cols*CS;o.height=rows*CS;
            const ox=o.getContext('2d');
            const n=pool.length;
            const A=new Float32Array(n*3);
            pool.forEach((t,k)=>{A[k*3]=t.a[0];A[k*3+1]=t.a[1];A[k*3+2]=t.a[2]});
            const uses=new Int32Array(n);

            const K=Math.min(6,n),cache=new Map();
            function cand(r,g,b){
              const key=((r>>4)<<8)|((g>>4)<<4)|(b>>4);
              let c=cache.get(key);
              if(c)return c;
              const cr=(r>>4)*16+8,cg=(g>>4)*16+8,cb=(b>>4)*16+8;
              const ds=new Array(K).fill(1e18),ids=new Array(K).fill(0);
              for(let k=0;k<n;k++){
                const dr=A[k*3]-cr,dg=A[k*3+1]-cg,db=A[k*3+2]-cb;
                const d=dr*dr+dg*dg+db*db;
                if(d<ds[K-1]){
                  let j=K-1;
                  while(j>0&&ds[j-1]>d){ds[j]=ds[j-1];ids[j]=ids[j-1];j--}
                  ds[j]=d;ids[j]=k;
                }
              }
              cache.set(key,ids);
              return ids;
            }

            let tm=performance.now();
            for(let y=0;y<rows;y++){
              for(let x=0;x<cols;x++){
                const i=(y*cols+x)*4,r=px[i],g=px[i+1],b=px[i+2];
                const c=cand(r,g,b);
                const pick=c[(Math.random()*K)|0];
                uses[pick]++;
                ox.drawImage(pool[pick].c,x*CS,y*CS,CS,CS);
                ox.fillStyle=`rgba(${r},${g},${b},.28)`;ox.fillRect(x*CS,y*CS,CS,CS);
              }
              if(performance.now()-tm>50){
                $('st').textContent=`Building… ${Math.round(y/rows*100)}%`;
                await sleep(0);
                tm=performance.now();
              }
            }
            let used=0,px_=0,wc=0;
            for(let k=0;k<n;k++){if(uses[k]){used++}}
            pool.forEach(t=>{if(t.src==='px')px_++;else wc++});
            $('st').textContent=`Done: ${cells.toLocaleString()} tiles using ${used} different images (pool: ${px_} Pixabay, ${wc} Wikimedia Commons). ${o.width}×${o.height}px.`;
            $('dl').disabled=false;
          }

          $('dl').onclick=()=>{
            const jpg=$('fm').value==='jpg';
            $('out').toBlob(b=>{
              const a=document.createElement('a');
              a.download=jpg?'mosaic.jpg':'mosaic.png';
              a.href=URL.createObjectURL(b);a.click();
              $('st').textContent+=` Saved ${(b.size/1048576).toFixed(1)} MB.`;
            },jpg?'image/jpeg':'image/png',0.85);
          };
          </script>
          </main></body></html>
          EOF_HTML
          sed -i "s/__PIXABAY_KEY__/${PIXABAY_KEY}/" site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
